[project]
name = "langgraph-spec-toolkit"
version = "0.1.0"
description = "MCP server + Claude skill for building LangGraph projects by editing a structured YAML spec instead of regenerating Python each turn"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
langgraph-spec-toolkit = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# examples/ contains generated build artifacts (graph.py is emitted
# byte-for-byte by renderer/render.py and asserted verbatim in tests) —
# not toolkit source, so it isn't linted/formatted to this repo's style.
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
